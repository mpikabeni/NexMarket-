<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#08080c"
    >

    <meta
        name="color-scheme"
        content="dark"
    >

    <title>NexMarket</title>

    <meta
        name="description"
        content="NexMarket — La marketplace des canaux Telegram en Afrique."
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>


<!-- =========================================================
     SPLASH SCREEN
========================================================= -->

<div
    id="splashScreen"
    class="splash-screen"
>

    <div class="splash-content">

        <div class="splash-logo">

            <img
                src="logo.png"
                alt="NexMarket"
            >

        </div>


        <h1>
            NexMarket
        </h1>


        <p>
            La marketplace des canaux Telegram
        </p>


        <div class="splash-loader">

            <span></span>
            <span></span>
            <span></span>

        </div>

    </div>


    <div class="splash-footer">

        Propulsé par
        <strong>NEXA</strong>

    </div>

</div>



<!-- =========================================================
     APPLICATION
========================================================= -->

<div
    id="app"
    class="app"
>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="top-header">


        <div class="header-left">


            <!-- PHOTO TELEGRAM -->

            <button
                id="profileAvatarButton"
                class="profile-avatar-button"
                type="button"
                aria-label="Ouvrir le portefeuille"
            >

                <div class="avatar-wrapper">


                    <img
                        id="telegramAvatar"
                        class="telegram-avatar hidden"
                        src=""
                        alt="Profil Telegram"
                    >


                    <div
                        id="avatarLetter"
                        class="avatar-letter"
                    >
                        N
                    </div>


                    <span class="avatar-online"></span>

                </div>

            </button>



            <div class="header-title-area">


                <span class="header-small-text">
                    Bienvenue
                </span>


                <h1>
                    NexMarket
                </h1>


                <span
                    id="headerGreeting"
                    class="header-greeting"
                >
                    Marketplace Telegram
                </span>

            </div>

        </div>



        <div class="header-actions">


            <button
                id="headerSearchButton"
                class="icon-button"
                type="button"
                aria-label="Rechercher"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >

                    <circle
                        cx="11"
                        cy="11"
                        r="7"
                    ></circle>

                    <path
                        d="m20 20-4-4"
                    ></path>

                </svg>

            </button>

        </div>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main
        id="pageContainer"
        class="page-container"
    >

        <!-- Les pages sont injectées par app.js -->

    </main>



    <!-- =====================================================
         FAQ
    ====================================================== -->

    <button
        id="faqButton"
        class="faq-button"
        type="button"
        aria-label="Questions fréquentes"
    >

        <span>
            ?
        </span>

    </button>



    <!-- =====================================================
         BOTTOM NAVIGATION
    ====================================================== -->

    <nav
        id="bottomNavigation"
        class="bottom-navigation"
        aria-label="Navigation principale"
    >


        <!-- ACCUEIL -->

        <button
            class="nav-item active"
            data-page="home"
            type="button"
        >

            <span class="nav-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >

                    <path
                        d="M3 10.5 12 3l9 7.5"
                    ></path>

                    <path
                        d="M5 9.5V21h14V9.5"
                    ></path>

                    <path
                        d="M9 21v-6h6v6"
                    ></path>

                </svg>

            </span>


            <span class="nav-label">
                Accueil
            </span>

        </button>



        <!-- ACHETER -->

        <button
            class="nav-item"
            data-page="buy"
            type="button"
        >

            <span class="nav-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >

                    <path
                        d="M6 8h12"
                    ></path>

                    <path
                        d="M7 8V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"
                    ></path>

                    <rect
                        x="4"
                        y="8"
                        width="16"
                        height="12"
                        rx="2"
                    ></rect>

                    <path
                        d="M9 12h6"
                    ></path>

                </svg>

            </span>


            <span class="nav-label">
                Acheter
            </span>

        </button>



        <!-- VENDRE -->

        <button
            class="nav-item"
            data-page="sell"
            type="button"
        >

            <span class="nav-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >

                    <path
                        d="M12 17V3"
                    ></path>

                    <path
                        d="m7 8 5-5 5 5"
                    ></path>

                    <path
                        d="M5 21h14"
                    ></path>

                </svg>

            </span>


            <span class="nav-label">
                Vendre
            </span>

        </button>



        <!-- MESSAGES -->

        <button
            class="nav-item"
            data-page="messages"
            type="button"
        >

            <span class="nav-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >

                    <path
                        d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H8l-4 2 1.5-4A7.5 7.5 0 1 1 20 11.5Z"
                    ></path>

                    <path
                        d="M8.5 11.5h.01"
                    ></path>

                    <path
                        d="M12 11.5h.01"
                    ></path>

                    <path
                        d="M15.5 11.5h.01"
                    ></path>

                </svg>

            </span>


            <span class="nav-label">
                Messages
            </span>

        </button>



        <!-- PROFIL -->

        <button
            class="nav-item"
            data-page="profile"
            type="button"
        >

            <span class="nav-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >

                    <circle
                        cx="12"
                        cy="8"
                        r="3.5"
                    ></circle>

                    <path
                        d="M5 20a7 7 0 0 1 14 0"
                    ></path>

                </svg>

            </span>


            <span class="nav-label">
                Profil
            </span>

        </button>


    </nav>



    <!-- =====================================================
         TOAST
    ====================================================== -->

    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
    >

        <div class="toast-icon"></div>


        <div class="toast-content">

            <strong id="toastTitle"></strong>

            <span id="toastMessage"></span>

        </div>

    </div>



    <!-- =====================================================
         MODAL
    ====================================================== -->

    <div
        id="modalContainer"
        class="modal-container hidden"
        aria-hidden="true"
    >


        <div
            id="modalOverlay"
            class="modal-overlay"
        ></div>


        <div
            id="modalContent"
            class="modal-content"
            role="dialog"
            aria-modal="true"
        >


            <button
                id="modalClose"
                class="modal-close"
                type="button"
                aria-label="Fermer"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    aria-hidden="true"
                >

                    <path
                        d="M6 6l12 12"
                    ></path>

                    <path
                        d="M18 6 6 18"
                    ></path>

                </svg>

            </button>


            <div id="modalBody"></div>

        </div>

    </div>


</div>



<!-- =========================================================
     TELEGRAM WEB APP
========================================================= -->

<script
    src="https://telegram.org/js/telegram-web-app.js"
></script>



<!-- =========================================================
     APPLICATION JAVASCRIPT
========================================================= -->

<script>
(function () {
    function startNexMarket() {
        var splash = document.getElementById("splashScreen");
        var app = document.getElementById("app");

        if (app) {
            app.classList.remove("hidden");
            app.style.display = "block";
            app.style.visibility = "visible";
            app.style.opacity = "1";
        }

        if (splash) {
            splash.style.opacity = "0";
            splash.style.visibility = "hidden";
            splash.style.pointerEvents = "none";

            setTimeout(function () {
                if (splash) {
                    splash.style.display = "none";
                    splash.remove();
                }
            }, 500);
        }

        console.log("NexMarket : splash terminé");
    }

    setTimeout(startNexMarket, 2500);
    window.addEventListener("error", function () { startNexMarket(); });
    window.addEventListener("unhandledrejection", function () { startNexMarket(); });
})();
</script>

<script src="app.js?v=20261004-3"></script>

</body>
</html>
