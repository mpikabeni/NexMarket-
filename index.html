<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#10051f">
  <meta name="color-scheme" content="dark">
  <title>NexMarket</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <button class="top-avatar" id="profileTop" aria-label="Profil">
      <img id="telegramAvatar" src="" alt="">
      <span id="avatarFallback">N</span>
      <i class="online-dot"></i>
    </button>
    <div class="top-title">
      <span class="top-kicker">NEXA</span>
      <strong>NexMarket</strong>
      <small id="topSubtitle">Marketplace Telegram</small>
    </div>
    <button class="top-icon" id="searchBtn" aria-label="Rechercher">⌕</button>
    <button class="top-icon" id="moreBtn" aria-label="Plus">⋮</button>
  </header>

  <main id="page" class="page"></main>

  <button class="help-fab" id="helpBtn" aria-label="Aide"><span>?</span></button>

  <nav class="bottom-nav" aria-label="Navigation principale">
    <button class="nav active" data-page="home"><span>⌂</span><small>Accueil</small></button>
    <button class="nav" data-page="buy"><span>▦</span><small>Acheter</small></button>
    <button class="nav" data-page="sell"><span>↥</span><small>Vendre</small></button>
    <button class="nav" data-page="messages"><span>◫</span><small>Messages</small></button>
    <button class="nav" data-page="profile"><span>◯</span><small>Profil</small></button>
  </nav>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <section class="sheet">
      <button class="sheet-close" data-close aria-label="Fermer">×</button>
      <div id="modalBody"></div>
    </section>
  </div>

  <div id="toast" class="toast"></div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app.js"></script>
</body>
</html>
