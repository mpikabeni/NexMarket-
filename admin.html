<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10051f">
<title>NexMarket — Administration</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-shell">
<header class="admin-top">
 <div class="brand"><button class="admin-back" onclick="location.href='index.html'">‹</button><div><span>§ ADMIN / CONSOLE</span><h1>NexMarket</h1><small>Tableau de bord opérationnel</small></div></div>
 <button id="adminMore">⋮</button>
</header>
<main class="admin-main">
 <div class="admin-title"><span class="kicker">§ ADMIN / CONSOLE</span><h2>Administration</h2></div>
 <section class="stat-card"><div class="row between"><div><span>§ V03 — VOLUME TOTAL</span><strong id="volume">—</strong><small>Volume traité</small></div><div class="money-icon">$</div></div></section>
 <div class="section-label">§ MÉTRIQUES</div>
 <section class="metric-empty">IMPOSSIBLE DE CHARGER LES<br>STATISTIQUES</section>
 <div class="section-label">§ MODULES</div>
 <input class="module-search" id="moduleSearch" placeholder="⌕  Rechercher un module...">
 <div class="section-label">§ CORE OPÉRATIONS</div>
 <div class="modules">
  <button class="module" data-module="users"><i>♙</i><div><small>§ M01</small><b>Utilisateurs</b><span>Gérer tous les utilisateurs</span></div><em>›</em></button>
  <button class="module" data-module="transactions"><i>⇄</i><div><small>§ M02</small><b>Transactions</b><span>Historique complet</span></div><em>›</em></button>
  <button class="module" data-module="transfers"><i>⇆</i><div><small>§ M04</small><b>Transfert de solde</b><span>Transférer entre utilisateurs</span></div><em>›</em></button>
  <button class="module blue-border" data-module="fees"><i>▣</i><div><small>§ M05</small><b>Frais</b><span>Configuration des frais</span></div><em>›</em></button>
 </div>
 <div class="section-label">§ GROWTH / PRODUITS & CANAUX</div>
 <div class="modules">
  <button class="module" data-module="listings"><i>⌁</i><div><small>§ M06</small><b>Annonces</b><span>Approuver, rejeter, suspendre</span></div><em>›</em></button>
  <button class="module" data-module="messages"><i>□</i><div><small>§ M08</small><b>Messages</b><span>Support utilisateurs</span></div><em>›</em></button>
  <button class="module" data-module="stats"><i>▥</i><div><small>§ M07</small><b>Statistiques</b><span>Pays, opérateurs, croissance</span></div><em>›</em></button>
 </div>
 <button class="module red" id="adminExit"><i>↪</i><div><small>§ EXIT</small><b>Déconnexion admin</b><span>Quitter la console</span></div><em>›</em></button>
</main>
<footer>NEXA · NexMarket Administration</footer>
<div id="adminModal" class="admin-modal hidden"><div class="admin-backdrop"></div><section><button id="closeAdmin">×</button><div id="adminBody"></div></section></div>
</div>
<script src="admin.js"></script>
</body>
</html>
